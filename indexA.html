<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Météo">
<title>Météo des Humeurs</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e8;--card:rgba(255,255,255,0.7);--text:#1a1612;--text2:#7a6f64;
  --border:rgba(0,0,0,0.08);--shadow:rgba(0,0,0,0.06);
  --active:#1a1612;--active-text:#f5f0e8;
  --nudge:#8b3a3a;--nudge-bg:rgba(139,58,58,0.07);
  --done:#4a7a4a;--done-bg:rgba(74,122,74,0.06);
  --sep:rgba(0,0,0,0.1);
  --c1:40px;--c2:92px;
  --header-h:64px;--footer-h:96px;--btn-gap:3px;
}
.dark{
  --bg:#0f0e0c;--card:rgba(28,26,22,0.9);--text:#f0ebe0;--text2:#7a7268;
  --border:rgba(255,255,255,0.07);--shadow:rgba(0,0,0,0.3);
  --active:#f0ebe0;--active-text:#0f0e0c;
  --nudge:#e8a87c;--nudge-bg:rgba(232,168,124,0.07);
  --done:#6a9a6a;--done-bg:rgba(106,154,106,0.07);
  --sep:rgba(255,255,255,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background 0.5s ease;}
.app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top,10px) 10px env(safe-area-inset-bottom,10px) 10px;}

/* Header fixe */
.other-card{
  background:var(--card);border:1.5px solid var(--text2);border-radius:13px;
  display:flex;align-items:stretch;box-shadow:0 2px 10px var(--shadow);
  flex-shrink:0;height:var(--header-h);
}
.h-c1{width:var(--c1);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.other-emoji{font-size:28px;line-height:1;}
.h-c2{width:var(--c2);flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 8px 0 0;}
.other-label{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);font-weight:500;}
.other-name{font-family:'Instrument Serif',serif;font-size:14px;font-style:italic;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.other-time{font-size:8px;color:var(--text2);opacity:0.8;}
.vsep{width:1px;background:var(--sep);margin:8px 0;flex-shrink:0;}
.h-c3{flex:1;display:flex;align-items:center;padding:0 10px;}
.other-desc{font-size:9px;color:var(--text2);font-weight:300;line-height:1.4;}

/* Espaceur flexible */
.spacer{flex:1;}

/* Boutons */
.buttons-list{display:flex;flex-direction:column;gap:var(--btn-gap);flex-shrink:0;}
.btn-row{display:flex;align-items:stretch;width:100%;}
.status-btn{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  display:flex;align-items:stretch;cursor:pointer;
  transition:background 0.2s,border-color 0.2s;
  box-shadow:0 1px 3px var(--shadow);flex:1;overflow:hidden;padding:0;
}
.status-btn:active{opacity:0.8;}
.status-btn.active{background:var(--active);border-color:var(--active);flex:0 0 calc(100% - 36px);}
.status-btn.active .b-label{color:var(--active-text);}
.status-btn.active .b-desc{color:var(--active-text);opacity:0.6;}
.status-btn.active .vsep{background:rgba(255,255,255,0.15);}
.b-c1{width:var(--c1);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.b-emoji{font-size:17px;line-height:1;}
.b-c2{width:var(--c2);flex-shrink:0;display:flex;align-items:center;padding:0 8px 0 0;}
.b-label{font-size:10.5px;font-weight:500;color:var(--text);line-height:1.2;}
.b-c3{flex:1;display:flex;align-items:center;padding:0 8px;}
.b-desc{font-size:8.5px;color:var(--text2);font-weight:300;line-height:1.3;}
.btn-vous{font-size:8px;color:var(--text2);font-weight:500;width:32px;text-align:center;flex-shrink:0;display:none;align-self:center;}

/* Footer fixe */
.nudge-row{
  display:flex;align-items:stretch;gap:4px;
  flex-shrink:0;height:var(--footer-h);
}
.nudge-main{
  background:var(--nudge-bg);border:1px solid rgba(139,58,58,0.15);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.15s;width:33%;flex-shrink:0;gap:3px;padding:8px;
}
.nudge-main.waiting{background:rgba(100,100,100,0.07);border-color:rgba(100,100,100,0.15);opacity:0.5;cursor:default;}
.nudge-main:active{transform:scale(0.97);}
.nudge-main.waiting:active{transform:none;}
.dark .nudge-main{border-color:rgba(232,168,124,0.15);}
.n-flag{font-size:15px;line-height:1;}
.n-text{font-size:8.5px;color:var(--nudge);font-weight:500;text-align:center;line-height:1.2;}
.nudge-main.waiting .n-text{color:var(--text2);}
.nudge-pills{display:flex;flex-direction:column;gap:3px;flex:1;}
.pill{
  border-radius:7px;padding:0 7px;font-size:8px;
  border:1px solid var(--border);background:var(--card);
  color:var(--text2);display:flex;align-items:center;gap:4px;
  flex:1;white-space:nowrap;overflow:hidden;
}
.pill.grow2{flex:2;}.pill.grow3{flex:3;}.pill.grow4{flex:4;}
.p-icon{flex-shrink:0;}
.p-main{font-weight:500;color:var(--text);flex-shrink:0;}
.p-sub{opacity:0.75;flex:1;overflow:hidden;text-overflow:ellipsis;}
.pill.done{border-color:rgba(74,122,74,0.3);background:var(--done-bg);}
.pill.done .p-main{color:var(--done);}
.pill.notified,.pill.pending{border-color:rgba(139,58,58,0.3);background:var(--nudge-bg);}
.pill.notified .p-main,.pill.pending .p-main{color:var(--nudge);}
.pill.future{opacity:0.6;}
.pill.none{justify-content:center;opacity:0.4;font-style:italic;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:var(--bg);padding:7px 16px;border-radius:100px;font-size:12px;font-weight:500;opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="other-card">
    <div class="h-c1"><span class="other-emoji" id="other-emoji">…</span></div>
    <div class="h-c2">
      <div class="other-label">Marie-Sophie</div>
      <div class="other-name" id="other-name">chargement</div>
      <div class="other-time" id="other-time"></div>
    </div>
    <div class="vsep"></div>
    <div class="h-c3"><div class="other-desc" id="other-desc"></div></div>
  </div>
  <div class="spacer" id="spacer-top"></div>
  <div class="buttons-list" id="buttons-list"></div>
  <div class="spacer" id="spacer-bot"></div>
  <div class="nudge-row">
    <button class="nudge-main" id="nudge-btn" onclick="sendNudge()">
      <span class="n-flag">🚩</span>
      <span class="n-text">demander une mise à jour</span>
    </button>
    <div class="nudge-pills" id="nudge-pills"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDoKJZJiIVGux81dxvfhUscqe9c0baElQ4",authDomain:"meteo-des-humeurs.firebaseapp.com",databaseURL:"https://meteo-des-humeurs-default-rtdb.europe-west1.firebasedatabase.app",projectId:"meteo-des-humeurs"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const MY_USER="user1",OTHER_USER="user2";

const choices=[
  {emoji:"💥",label:"Hot and brave",desc:"consentement à l'imprévu sexuel et kinky total, y compris CNC"},
  {emoji:"🔥",label:"Heat wave",desc:"consentement à l'imprévu sexuel et kinky engagé (ex: lieux engageants, invité·e·s) sans perte de contrôle"},
  {emoji:"❤️‍🔥",label:"Control kink",desc:"consentement à l'imprévu sexuel kinky sans perte de contrôle"},
  {emoji:"❤️",label:"Sweet body",desc:"consentement à l'imprévu sexuel vanille"},
  {emoji:"🩷",label:"Sweet heart",desc:"consentement à l'imprévu non-sexuel"},
  {emoji:"🤍",label:"Own Peace",desc:"besoin de respirer / me reposer / dormir, ne pas me déranger"},
  {emoji:"🏳",label:"White romance",desc:"épuisé·e mais besoin de toi"},
  {emoji:"🏴",label:"Dark romance",desc:"je ne vais pas bien et j'ai besoin de toi"},
  {emoji:"🕷",label:"Dark Vador",desc:"je ne vais pas bien mais j'aimerais qu'on me laisse"},
  {emoji:"🐝",label:"Busy bee",desc:"au travail / en groupe / truc important, ne pas déranger"},
  {emoji:"🪹",label:"Cuckoo's nest",desc:"en bonne compagnie, ne pas déranger"},
  {emoji:"🪺",label:"Bonobo's nest",desc:"en bonne compagnie, imprévus bienvenus si compagnie consentante et prévenue (ou complice) — inclus dans 💥 et 🔥"}
];

let myCurrentStatus=null;
let otherUpdateTs=0;

function updateTheme(){document.body.classList.toggle('dark',new Date().getHours()>=20||new Date().getHours()<7);}

// Timestamp valide = > 1er jan 2020
function isValidTs(ts){return ts>1577836800000;}

// Sanitize timestamp : si 0 ou invalide, retourne Date.now()
function sanitizeTs(ts){return isValidTs(ts)?ts:Date.now();}

function fmtTime(ts){
  const d=new Date(ts);
  return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}

function fmtDayLabel(ts){
  const d=new Date(ts),now=new Date();
  const dm=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const tm=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const diff=Math.round((dm-tm)/86400000);
  if(diff===0) return "aujourd'hui";
  if(diff===-1) return 'hier';
  if(diff===-2) return 'avant-hier';
  if(diff===1) return 'demain';
  if(diff<0) return 'il y a '+Math.abs(diff)+' jours';
  return 'dans '+diff+' jours';
}

function fmtFull(ts){
  ts=sanitizeTs(ts);
  const day=fmtDayLabel(ts);
  return day+' '+fmtTime(ts);
}

// Pour le header : "aujourd'hui à 14:32" ou "hier à 14:32"
function fmtElapsed(ts){
  ts=sanitizeTs(ts);
  return fmtDayLabel(ts)+' à '+fmtTime(ts);
}

// Alias pour pastilles
function fmtElapsedShort(ts){return fmtFull(ts);}

function updateOtherTime(){
  if(otherUpdateTs>0) document.getElementById('other-time').textContent=fmtElapsed(otherUpdateTs);
}

function getDesc(t){const f=choices.find(c=>t.startsWith(c.emoji));return f?f.desc:'';}

function renderButtons(){
  const list=document.getElementById('buttons-list');
  list.innerHTML='';
  choices.forEach(c=>{
    const full=c.emoji+' '+c.label;
    const row=document.createElement('div');
    row.className='btn-row';
    const btn=document.createElement('button');
    btn.className='status-btn';
    btn.dataset.value=full;
    btn.innerHTML=
      '<div class="b-c1"><span class="b-emoji">'+c.emoji+'</span></div>'+
      '<div class="b-c2"><span class="b-label">'+c.label+'</span></div>'+
      '<div class="vsep"></div>'+
      '<div class="b-c3"><span class="b-desc">'+c.desc+'</span></div>';
    btn.onclick=()=>setMyStatus(full);
    const vous=document.createElement('span');
    vous.className='btn-vous';
    vous.textContent='← vous';
    row.appendChild(btn);
    row.appendChild(vous);
    list.appendChild(row);
  });
  layoutButtons();
}

function layoutButtons(){
  const app=document.querySelector('.app');
  const header=document.querySelector('.other-card');
  const footer=document.querySelector('.nudge-row');
  const list=document.getElementById('buttons-list');
  const rows=list.querySelectorAll('.btn-row');
  if(!rows.length) return;

  const appH=app.clientHeight;
  const padT=parseInt(getComputedStyle(app).paddingTop)||10;
  const padB=parseInt(getComputedStyle(app).paddingBottom)||10;
  const headerH=64;
  const footerH=96;
  const n=rows.length;
  const totalGap=(n-1)*3;
  const available=appH-padT-padB-headerH-footerH-totalGap;
  const btnH=Math.max(Math.floor(available/n),26);

  rows.forEach(row=>{
    const btn=row.querySelector('.status-btn');
    if(btn){btn.style.height=btnH+'px';}
  });

  // Espaceurs = reste divisé en 2
  const used=btnH*n+totalGap;
  const remaining=Math.max(0,available-used);
  const s1=document.getElementById('spacer-top');
  const s2=document.getElementById('spacer-bot');
  const half=Math.floor(remaining/2);
  if(s1) s1.style.cssText='height:'+half+'px;flex-shrink:0;flex-grow:0;';
  if(s2) s2.style.cssText='height:'+(remaining-half)+'px;flex-shrink:0;flex-grow:0;';
}

function highlightActive(s){
  document.querySelectorAll('.status-btn').forEach(b=>{
    const on=b.dataset.value===s;
    b.classList.toggle('active',on);
    const v=b.closest('.btn-row')?.querySelector('.btn-vous');
    if(v) v.style.display=on?'block':'none';
  });
}

function setMyStatus(s){
  const confirm=s===myCurrentStatus;
  myCurrentStatus=s;
  highlightActive(s);
  db.ref('status/'+MY_USER).set({text:s,time:Date.now()});
  // Remet n à false si nudge en attente
  db.ref('meta/'+MY_USER+'/n').once('value',snap=>{
    if(snap.val()===true||snap.val()==='true') db.ref('meta/'+MY_USER+'/n').set(false);
  });
  showToast(confirm?'Statut confirmé ✓':'Statut mis à jour ✓');
  setTimeout(refreshNudgePanel,500);
}

// Statut de l'autre en temps réel
db.ref('status/'+OTHER_USER).on('value',snap=>{
  const d=snap.val();
  if(!d){
    document.getElementById('other-emoji').textContent='—';
    document.getElementById('other-name').textContent='pas encore de statut';
    document.getElementById('other-desc').textContent='';
    document.getElementById('other-time').textContent='';
    otherUpdateTs=0;return;
  }
  const p=d.text.split(' ');
  document.getElementById('other-emoji').textContent=p[0];
  document.getElementById('other-name').textContent=p.slice(1).join(' ');
  document.getElementById('other-desc').textContent=getDesc(d.text);
  otherUpdateTs=d.time;
  updateOtherTime();
});

// Mon statut — on() pour détecter changements PWA et Raccourci
db.ref('status/'+MY_USER).on('value',snap=>{
  const d=snap.val();
  if(d){myCurrentStatus=d.text;highlightActive(d.text);}
});

function makePill(icon,main,sub,cls,grow){
  const p=document.createElement('div');
  p.className='pill '+cls+(grow>1?' grow'+grow:'');
  p.innerHTML=(icon?'<span class="p-icon">'+icon+'</span>':'')+
    '<span class="p-main">'+main+'</span>'+
    (sub?'<span class="p-sub">'+sub+'</span>':'');
  return p;
}

function refreshNudgePanel(){
  const pillsEl=document.getElementById('nudge-pills');
  const mainBtn=document.getElementById('nudge-btn');
  Promise.all([
    db.ref('meta/'+OTHER_USER+'/schedule').once('value'),
    db.ref('meta/'+OTHER_USER+'/nudge_sent_at').once('value'),
    db.ref('meta/'+OTHER_USER+'/nudge_notified_at').once('value'),
    db.ref('meta/'+OTHER_USER+'/n').once('value'),
    db.ref('status/'+OTHER_USER).once('value')
  ]).then(([schedSnap,sentSnap,notifSnap,activeSnap,statusSnap])=>{
    const now=Date.now();
    const sched=schedSnap.val();
    const nudgeSentAt=Number(sentSnap.val()||0);
    const nudgeNotifiedAt=Number(notifSnap.val()||0);
    const nudgeActive=activeSnap.val()===true||activeSnap.val()==='true';
    const lastUpdate=Number(statusSnap.val()?.time||0);

    const future=((sched?.slots)||[]).filter(t=>t>now).sort((a,b)=>a-b);
    const past=((sched?.slots)||[]).filter(t=>t<=now).sort((a,b)=>b-a);

    const nudgeSent=nudgeSentAt>0;
    const nudgePending=nudgeSent&&nudgeActive&&nudgeSentAt>lastUpdate;
    const nudgeNotified=nudgeSent&&!nudgeActive&&nudgeNotifiedAt>0&&nudgeSentAt>lastUpdate;
    const nudgeUnanswered=nudgePending||nudgeNotified;
    const unanswered=past.filter(t=>t>lastUpdate);
    const hasWaiting=nudgeUnanswered||unanswered.length>0;

    // Dernière requête répondue parmi tous les événements
    const allEvents=[...past];
    if(nudgeSent) allEvents.push(nudgeSentAt);
    allEvents.sort((a,b)=>b-a);
    const lastAnsweredTs=lastUpdate>0?allEvents.find(t=>t<=lastUpdate):null;
    const lastAnsweredIsNudge=nudgeSent&&lastAnsweredTs!=null&&Math.abs(lastAnsweredTs-nudgeSentAt)<5000;

    // Pastilles réelles (max 4 — la 1 est toujours l'historique)
    let pills=[];

    // 1. Historique — TOUJOURS présent même après nouveau nudge
    if(lastAnsweredTs){
      pills.push({icon:lastAnsweredIsNudge?'🚩':'⏰',main:fmtElapsedShort(lastAnsweredTs),sub:'✔️ '+fmtElapsedShort(lastUpdate),cls:'done'});
    } else {
      pills.push({icon:'',main:'aucune réponse',sub:'',cls:'none'});
    }

    // 2-4. Alertes en attente puis prévues
    if(nudgeUnanswered){
      const sub=nudgePending?'⏳ envoyé':'🛎️ notifié '+fmtElapsedShort(nudgeNotifiedAt);
      pills.push({icon:'🚩',main:fmtElapsedShort(nudgeSentAt),sub,cls:'notified'});
    }
    unanswered.forEach(t=>{
      pills.push({icon:'⏰',main:fmtElapsedShort(t),sub:'🛎️ en attente',cls:'pending'});
    });
    future.forEach(t=>{
      pills.push({icon:'⏰',main:fmtElapsedShort(t),sub:'⏳ programmé',cls:'future'});
    });

    const realCount=Math.min(pills.length,4);
    const noneGrow=4-realCount;

    pillsEl.innerHTML='';
    pills.slice(0,4).forEach(p=>pillsEl.appendChild(makePill(p.icon,p.main,p.sub,p.cls,1)));
    if(noneGrow>0){
      pillsEl.appendChild(makePill('','pas d\'autre alerte avant demain','','none',noneGrow));
    }

    mainBtn.classList.toggle('waiting',hasWaiting);
    mainBtn.onclick=hasWaiting?null:sendNudge;
  });
}

function sendNudge(){
  db.ref('meta/'+OTHER_USER+'/n').set(true);
  db.ref('meta/'+OTHER_USER+'/nudge_sent_at').set(Date.now());
  db.ref('meta/'+OTHER_USER+'/nudge_notified_at').set(0);
  showToast('🚩 Demande envoyée');
  setTimeout(refreshNudgePanel,500);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

updateTheme();
renderButtons();
refreshNudgePanel();
setInterval(updateTheme,60000);
setInterval(refreshNudgePanel,30000);
setInterval(updateOtherTime,60000);
window.addEventListener('resize',layoutButtons);
</script>
</body>
</html>
