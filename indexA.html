<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Météo">
<title>Météo des Humeurs</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e8;--card:rgba(255,255,255,0.7);--text:#1a1612;--text2:#7a6f64;
  --border:rgba(0,0,0,0.08);--shadow:rgba(0,0,0,0.06);
  --active:#1a1612;--active-text:#f5f0e8;
  --nudge:#8b3a3a;--nudge-bg:rgba(139,58,58,0.07);
  --done:#4a7a4a;--done-bg:rgba(74,122,74,0.06);
  --sep:rgba(0,0,0,0.1);
}
.dark{
  --bg:#0f0e0c;--card:rgba(28,26,22,0.9);--text:#f0ebe0;--text2:#7a7268;
  --border:rgba(255,255,255,0.07);--shadow:rgba(0,0,0,0.3);
  --active:#f0ebe0;--active-text:#0f0e0c;
  --nudge:#e8a87c;--nudge-bg:rgba(232,168,124,0.07);
  --done:#6a9a6a;--done-bg:rgba(106,154,106,0.07);
  --sep:rgba(255,255,255,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background 0.5s ease;}
.app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top,10px) 10px env(safe-area-inset-bottom,10px) 10px;gap:4px;}

/* Header */
.other-card{background:var(--card);border:1.5px solid var(--text2);border-radius:13px;padding:8px 0 8px 0;display:flex;align-items:stretch;box-shadow:0 3px 12px var(--shadow);flex-shrink:0;}
.col-emoji{width:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.other-emoji{font-size:28px;line-height:1;}
.col-info{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 8px 0 0;flex-shrink:0;}
.other-label{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);font-weight:500;}
.other-name{font-family:'Instrument Serif',serif;font-size:14px;font-style:italic;color:var(--text);line-height:1.2;}
.other-time{font-size:8px;color:var(--text2);opacity:0.7;}
.col-sep{width:1px;background:var(--sep);margin:4px 0;flex-shrink:0;}
.col-desc{flex:1;display:flex;align-items:center;padding:0 10px;}
.other-desc{font-size:9px;color:var(--text2);font-weight:300;line-height:1.4;}

/* Boutons — même layout 3 colonnes que header */
.buttons-list{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden;}
.btn-row{display:flex;align-items:stretch;width:100%;gap:4px;}
.status-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:stretch;cursor:pointer;transition:all 0.2s ease;box-shadow:0 1px 3px var(--shadow);flex:1;text-align:left;overflow:hidden;padding:0;}
.status-btn:active{transform:scale(0.98);opacity:0.85;}
.status-btn.active{background:var(--active);border-color:var(--active);flex:0 0 calc(100% - 36px);}
.status-btn.active .btn-label{color:var(--active-text);}
.status-btn.active .btn-desc{color:var(--active-text);opacity:0.6;}
.status-btn.active .btn-sep{background:rgba(255,255,255,0.15);}
.btn-ecol{width:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.btn-emoji{font-size:18px;line-height:1;}
.btn-icol{display:flex;align-items:center;padding:6px 8px 6px 0;flex-shrink:0;}
.btn-label{font-size:11px;font-weight:500;color:var(--text);display:block;line-height:1.2;}
.btn-sep{width:1px;background:var(--sep);margin:4px 0;flex-shrink:0;}
.btn-dcol{flex:1;display:flex;align-items:center;padding:6px 8px;}
.btn-desc{font-size:8.5px;color:var(--text2);font-weight:300;line-height:1.3;}
.btn-vous{font-size:8px;color:var(--text2);font-weight:500;width:32px;text-align:center;flex-shrink:0;display:none;align-self:center;}

/* Footer nudge */
.nudge-row{display:flex;align-items:stretch;gap:4px;flex-shrink:0;}
.nudge-main{background:var(--nudge-bg);border:1px solid rgba(139,58,58,0.15);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s ease;width:33%;flex-shrink:0;gap:2px;}
.nudge-main.waiting{background:rgba(100,100,100,0.07);border-color:rgba(100,100,100,0.15);opacity:0.5;cursor:default;}
.nudge-main:active{transform:scale(0.97);}
.nudge-main.waiting:active{transform:none;}
.dark .nudge-main{border-color:rgba(232,168,124,0.15);}
.nudge-flag{font-size:15px;line-height:1;}
.nudge-main-text{font-size:8.5px;color:var(--nudge);font-weight:500;text-align:center;line-height:1.2;}
.nudge-main.waiting .nudge-main-text{color:var(--text2);}
.nudge-pills{display:flex;flex-direction:column;gap:3px;flex:1;}
.pill{border-radius:7px;padding:0 7px;font-size:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);display:flex;align-items:center;gap:5px;flex:1;white-space:nowrap;overflow:hidden;}
.pill-icon{flex-shrink:0;font-size:10px;}
.pill-main{font-weight:500;color:var(--text);flex-shrink:0;}
.pill-sub{opacity:0.75;flex:1;overflow:hidden;text-overflow:ellipsis;}
.pill.done{border-color:rgba(74,122,74,0.3);background:var(--done-bg);}
.pill.done .pill-main{color:var(--done);}
.pill.notified{border-color:rgba(139,58,58,0.35);background:var(--nudge-bg);}
.pill.notified .pill-main{color:var(--nudge);}
.pill.pending{border-color:rgba(139,58,58,0.2);background:var(--nudge-bg);}
.pill.pending .pill-main{color:var(--nudge);}
.pill.future{opacity:0.6;}
.pill.none{justify-content:center;opacity:0.4;font-style:italic;}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:var(--bg);padding:7px 16px;border-radius:100px;font-size:12px;font-weight:500;opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="other-card">
    <div class="col-emoji"><span class="other-emoji" id="other-emoji">…</span></div>
    <div class="col-info">
      <div class="other-label">Marie-Sophie</div>
      <div class="other-name" id="other-name">chargement</div>
      <div class="other-time" id="other-time"></div>
    </div>
    <div class="col-sep"></div>
    <div class="col-desc"><div class="other-desc" id="other-desc"></div></div>
  </div>
  <div class="buttons-list" id="buttons-list"></div>
  <div class="nudge-row">
    <button class="nudge-main" id="nudge-main-btn" onclick="sendNudge()">
      <span class="nudge-flag">🚩</span>
      <span class="nudge-main-text">demander une mise à jour</span>
    </button>
    <div class="nudge-pills" id="nudge-pills"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDoKJZJiIVGux81dxvfhUscqe9c0baElQ4",authDomain:"meteo-des-humeurs.firebaseapp.com",databaseURL:"https://meteo-des-humeurs-default-rtdb.europe-west1.firebasedatabase.app",projectId:"meteo-des-humeurs"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const MY_USER="user1",OTHER_USER="user2";

const choices=[
  {emoji:"💥",label:"Hot and brave",desc:"consentement à l'imprévu sexuel et kinky total, y compris CNC"},
  {emoji:"🔥",label:"Heat wave",desc:"consentement à l'imprévu sexuel et kinky engagé (ex: lieux engageants, invité·e·s) sans perte de contrôle"},
  {emoji:"❤️‍🔥",label:"Control kink",desc:"consentement à l'imprévu sexuel kinky sans perte de contrôle"},
  {emoji:"❤️",label:"Sweet body",desc:"consentement à l'imprévu sexuel vanille"},
  {emoji:"🩷",label:"Sweet heart",desc:"consentement à l'imprévu non-sexuel"},
  {emoji:"🤍",label:"Own Peace",desc:"besoin de respirer / me reposer / dormir, ne pas me déranger"},
  {emoji:"🏳",label:"White romance",desc:"épuisé·e mais besoin de toi"},
  {emoji:"🏴",label:"Dark romance",desc:"je ne vais pas bien et j'ai besoin de toi"},
  {emoji:"🕷",label:"Dark Vador",desc:"je ne vais pas bien mais j'aimerais qu'on me laisse"},
  {emoji:"🐝",label:"Busy bee",desc:"au travail / en groupe / truc important, ne pas déranger"},
  {emoji:"🪹",label:"Cuckoo's nest",desc:"en bonne compagnie, ne pas déranger"},
  {emoji:"🪺",label:"Bonobo's nest",desc:"en bonne compagnie, imprévus bienvenus si compagnie consentante et prévenue (ou complice) — inclus dans 💥 et 🔥"}
];

let myCurrentStatus=null;

function updateTheme(){document.body.classList.toggle('dark',new Date().getHours()>=20||new Date().getHours()<7);}

function fmtTime(ts){
  const d=new Date(ts);
  return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}

function fmtDayPrefix(ts){
  const d=new Date(ts);
  const now=new Date();
  const dDay=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(dDay===today) return '';
  if(dDay===today-86400000) return 'hier ';
  const months=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  return 'le '+d.getDate()+' '+months[d.getMonth()]+' ';
}

function fmtFull(ts){
  const p=fmtDayPrefix(ts);
  return p?p+fmtTime(ts):fmtTime(ts);
}

function fmtRelative(ts){
  const diff=Math.floor((Date.now()-ts)/60000);
  if(diff<5) return "à l'instant";
  const p=fmtDayPrefix(ts);
  if(!p) return "aujourd'hui à "+fmtTime(ts);
  return p+'à '+fmtTime(ts);
}

function renderButtons(){
  const list=document.getElementById('buttons-list');
  list.innerHTML='';
  choices.forEach(c=>{
    const full=c.emoji+' '+c.label;
    const row=document.createElement('div');
    row.className='btn-row';
    const btn=document.createElement('button');
    btn.className='status-btn';
    btn.dataset.value=full;
    btn.innerHTML=
      '<div class="btn-ecol"><span class="btn-emoji">'+c.emoji+'</span></div>'+
      '<div class="btn-icol"><span class="btn-label">'+c.label+'</span></div>'+
      '<div class="btn-sep"></div>'+
      '<div class="btn-dcol"><span class="btn-desc">'+c.desc+'</span></div>';
    btn.onclick=()=>setMyStatus(full);
    const vous=document.createElement('span');
    vous.className='btn-vous';
    vous.textContent='← vous';
    row.appendChild(btn);
    row.appendChild(vous);
    list.appendChild(row);
  });
}

function highlightActive(s){
  document.querySelectorAll('.status-btn').forEach(b=>{
    const isActive=b.dataset.value===s;
    b.classList.toggle('active',isActive);
    const vous=b.closest('.btn-row')?.querySelector('.btn-vous');
    if(vous) vous.style.display=isActive?'block':'none';
  });
}

function setMyStatus(s){
  const isConfirm=s===myCurrentStatus;
  myCurrentStatus=s;
  highlightActive(s);
  db.ref('status/'+MY_USER).set({text:s,time:Date.now()});
  showToast(isConfirm?'Statut confirmé ✓':'Statut mis à jour ✓');
  setTimeout(refreshNudgePanel,500);
}

function getDesc(t){const f=choices.find(c=>t.startsWith(c.emoji));return f?f.desc:'';}

db.ref('status/'+OTHER_USER).on('value',snap=>{
  const d=snap.val();
  if(!d){
    document.getElementById('other-emoji').textContent='—';
    document.getElementById('other-name').textContent='pas encore de statut';
    document.getElementById('other-desc').textContent='';
    document.getElementById('other-time').textContent='';
    return;
  }
  const p=d.text.split(' ');
  document.getElementById('other-emoji').textContent=p[0];
  document.getElementById('other-name').textContent=p.slice(1).join(' ');
  document.getElementById('other-desc').textContent=getDesc(d.text);
  document.getElementById('other-time').textContent='màj '+fmtRelative(d.time);
});

db.ref('status/'+MY_USER).once('value',snap=>{
  const d=snap.val();
  if(d){myCurrentStatus=d.text;highlightActive(d.text);}
});

function makePill(icon,main,sub,cls){
  const p=document.createElement('div');
  p.className='pill '+cls;
  p.innerHTML=(icon?'<span class="pill-icon">'+icon+'</span>':'')+
    '<span class="pill-main">'+main+'</span>'+
    (sub?'<span class="pill-sub">'+sub+'</span>':'');
  return p;
}

function refreshNudgePanel(){
  const pillsEl=document.getElementById('nudge-pills');
  const mainBtn=document.getElementById('nudge-main-btn');
  Promise.all([
    db.ref('meta/'+OTHER_USER+'/schedule').once('value'),
    db.ref('meta/'+OTHER_USER+'/nudge_sent_at').once('value'),
    db.ref('meta/'+OTHER_USER+'/nudge_notified_at').once('value'),
    db.ref('meta/'+OTHER_USER+'/n').once('value'),
    db.ref('status/'+OTHER_USER).once('value')
  ]).then(([schedSnap,sentSnap,notifiedSnap,activeSnap,statusSnap])=>{
    const now=Date.now();
    const sched=schedSnap.val();
    const nudgeSentAt=sentSnap.val()||0;
    const nudgeNotifiedAt=notifiedSnap.val()||0;
    const nudgeActive=activeSnap.val()===true||activeSnap.val()==='true';
    const lastUpdate=statusSnap.val()?.time||0;

    const futureSlots=((sched?.slots)||[]).filter(t=>t>now).sort((a,b)=>a-b);
    const pastSlots=((sched?.slots)||[]).filter(t=>t<=now).sort((a,b)=>b-a);

    // Etats nudge
    const nudgeSent=nudgeSentAt>0;
    const nudgePending=nudgeSent&&nudgeActive&&nudgeSentAt>lastUpdate;
    const nudgeNotified=nudgeSent&&!nudgeActive&&nudgeNotifiedAt>0&&nudgeSentAt>lastUpdate;
    const nudgeUnanswered=nudgePending||nudgeNotified;

    // Une seule réponse efface TOUTES les demandes antérieures
    // Toutes les requêtes passées (slots + nudge) antérieures à lastUpdate = répondues
    const unansweredSlots=pastSlots.filter(t=>t>lastUpdate);
    const hasWaiting=nudgeUnanswered||unansweredSlots.length>0;

    // Dernière requête répondue (la plus récente avant lastUpdate)
    const allPast=[...pastSlots];
    if(nudgeSent) allPast.push(nudgeSentAt);
    allPast.sort((a,b)=>b-a);
    const lastAnsweredTs=lastUpdate>0?allPast.find(t=>t<=lastUpdate):null;
    const lastAnsweredIsNudge=lastAnsweredTs&&nudgeSent&&lastAnsweredTs===nudgeSentAt;

    let pills=[];

    // Pastille 1 : toujours la dernière répondue
    if(lastAnsweredTs){
      pills.push(makePill(
        lastAnsweredIsNudge?'🚩':'⏰',
        fmtFull(lastAnsweredTs),
        '✔️ '+fmtTime(lastUpdate),
        'done'
      ));
    } else {
      pills.push(makePill('','aucune réponse encore','','none'));
    }

    // Pastille 2 : alerte la plus urgente en attente
    if(nudgeUnanswered){
      const sub=nudgePending?'⏳ envoyé':'🛎️ notifié à '+fmtTime(nudgeNotifiedAt);
      pills.push(makePill('🚩',fmtFull(nudgeSentAt),sub,'notified'));
    } else if(unansweredSlots.length>0){
      pills.push(makePill('⏰',fmtFull(unansweredSlots[0]),'🛎️ en attente','pending'));
    } else if(futureSlots.length>0){
      pills.push(makePill('⏰',fmtFull(futureSlots[0]),'⏳ programmé','future'));
    } else {
      pills.push(makePill('','pas d\'alerte avant demain','','none'));
    }

    // Pastille 3 : alerte suivante
    const nextFuture=nudgeUnanswered||unansweredSlots.length>0?futureSlots[0]:futureSlots[1];
    if(nextFuture){
      pills.push(makePill('⏰',fmtFull(nextFuture),'⏳ programmé','future'));
    } else if(pills.length<3){
      pills.push(makePill('','pas d\'autre alerte avant demain','','none'));
    }

    // Pastille 4 : encore suivante si dispo
    const nextFuture2=nudgeUnanswered||unansweredSlots.length>0?futureSlots[1]:futureSlots[2];
    if(nextFuture2){
      pills.push(makePill('⏰',fmtFull(nextFuture2),'⏳ programmé','future'));
    }

    pillsEl.innerHTML='';
    pills.slice(0,4).forEach(p=>pillsEl.appendChild(p));

    mainBtn.classList.toggle('waiting',hasWaiting);
    mainBtn.onclick=hasWaiting?null:sendNudge;
  });
}

function sendNudge(){
  db.ref('meta/'+OTHER_USER+'/n').set(true);
  db.ref('meta/'+OTHER_USER+'/nudge_sent_at').set(Date.now());
  db.ref('meta/'+OTHER_USER+'/nudge_notified_at').set(0);
  showToast('🚩 Demande envoyée');
  setTimeout(refreshNudgePanel,500);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

updateTheme();
renderButtons();
refreshNudgePanel();
setInterval(updateTheme,60000);
setInterval(refreshNudgePanel,30000);
</script>
</body>
</html>
