<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Météo">
<title>Météo des Humeurs</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f0e8;--card:rgba(255,255,255,0.7);
  --text:#1a1612;--text2:#7a6f64;
  --border:rgba(0,0,0,0.08);--shadow:rgba(0,0,0,0.06);
  --active:#1a1612;--active-text:#f5f0e8;
  --nudge:#8b3a3a;--nudge-bg:rgba(139,58,58,0.07);
  --done:#4a7a4a;
}
.dark {
  --bg:#0f0e0c;--card:rgba(28,26,22,0.9);
  --text:#f0ebe0;--text2:#7a7268;
  --border:rgba(255,255,255,0.07);--shadow:rgba(0,0,0,0.3);
  --active:#f0ebe0;--active-text:#0f0e0c;
  --nudge:#e8a87c;--nudge-bg:rgba(232,168,124,0.07);
  --done:#6a9a6a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background 0.5s ease;}
.app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top,10px) 10px env(safe-area-inset-bottom,10px) 10px;gap:5px;}

/* Carte autre */
.other-card{background:var(--card);border:1.5px solid var(--text2);border-radius:13px;padding:9px 11px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px var(--shadow);flex-shrink:0;}
.other-emoji{font-size:30px;line-height:1;flex-shrink:0;}
.other-text{flex:1;min-width:0;}
.other-label{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);font-weight:500;}
.other-name{font-family:'Instrument Serif',serif;font-size:14px;font-style:italic;color:var(--text);line-height:1.2;margin-top:1px;}
.other-desc{font-size:9px;color:var(--text2);font-weight:300;line-height:1.3;margin-top:2px;}
.other-time{font-size:8px;color:var(--text2);opacity:0.6;margin-top:2px;}

/* Boutons statut */
.buttons-list{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden;}
.btn-row{display:flex;align-items:center;width:100%;gap:4px;}
.status-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 9px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all 0.2s ease;box-shadow:0 1px 3px var(--shadow);flex:1;text-align:left;}
.status-btn:active{transform:scale(0.98);opacity:0.85;}
.status-btn.active{background:var(--active);border-color:var(--active);flex:0 0 calc(100% - 36px);}
.status-btn.active .btn-label{color:var(--active-text);}
.status-btn.active .btn-desc{color:var(--active-text);opacity:0.55;}
.btn-emoji{font-size:18px;line-height:1;flex-shrink:0;width:24px;text-align:center;}
.btn-text{flex:1;min-width:0;}
.btn-label{font-size:11px;font-weight:500;color:var(--text);display:block;line-height:1.2;}
.btn-desc{font-size:8.5px;color:var(--text2);font-weight:300;display:block;line-height:1.3;margin-top:1px;}
.btn-vous{font-size:8px;color:var(--text2);font-weight:500;width:32px;text-align:center;flex-shrink:0;display:none;align-self:center;line-height:1.3;}

/* Nudge */
.nudge-row{display:flex;align-items:stretch;gap:4px;flex-shrink:0;min-height:44px;}
.nudge-main{background:var(--nudge-bg);border:1px solid rgba(139,58,58,0.15);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s ease;width:33%;flex-shrink:0;gap:2px;}
.nudge-main.waiting{background:rgba(100,100,100,0.07);border-color:rgba(100,100,100,0.15);opacity:0.5;cursor:default;}
.nudge-main:active{transform:scale(0.97);}
.nudge-main.waiting:active{transform:none;}
.nudge-flag{font-size:15px;line-height:1;}
.nudge-main-text{font-size:8.5px;color:var(--nudge);font-weight:500;text-align:center;line-height:1.2;}
.nudge-main.waiting .nudge-main-text{color:var(--text2);}
.dark .nudge-main{border-color:rgba(232,168,124,0.15);}
.nudge-pills{display:flex;flex-wrap:wrap;gap:3px;flex:1;align-content:flex-start;}
.pill{border-radius:7px;padding:4px 6px;font-size:8px;line-height:1.3;border:1px solid var(--border);background:var(--card);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill.w2{width:calc(67% - 2px);}
.pill.w1{width:calc(33% - 2px);}
.pill.wfull{width:100%;}
.pill.waiting{border-color:rgba(139,58,58,0.25);color:var(--nudge);}
.pill.notified{border-color:rgba(139,58,58,0.35);color:var(--nudge);font-weight:500;}
.pill.done{border-color:rgba(74,122,74,0.3);color:var(--done);}
.pill.none{opacity:0.45;font-style:italic;}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:var(--bg);padding:7px 16px;border-radius:100px;font-size:12px;font-weight:500;opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="other-card">
    <span class="other-emoji" id="other-emoji">…</span>
    <div class="other-text">
      <div class="other-label">Adrien</div>
      <div class="other-name" id="other-name">chargement</div>
      <div class="other-desc" id="other-desc"></div>
      <div class="other-time" id="other-time"></div>
    </div>
  </div>
  <div class="buttons-list" id="buttons-list"></div>
  <div class="nudge-row">
    <button class="nudge-main" id="nudge-main-btn" onclick="sendNudge()">
      <span class="nudge-flag">🚩</span>
      <span class="nudge-main-text">demander une mise à jour</span>
    </button>
    <div class="nudge-pills" id="nudge-pills"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDoKJZJiIVGux81dxvfhUscqe9c0baElQ4",authDomain:"meteo-des-humeurs.firebaseapp.com",databaseURL:"https://meteo-des-humeurs-default-rtdb.europe-west1.firebasedatabase.app",projectId:"meteo-des-humeurs"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const MY_USER="user2",OTHER_USER="user1";

const choices=[
  {emoji:"💥",label:"Hot and brave",desc:"consentement à l'imprévu sexuel et kinky total, y compris CNC"},
  {emoji:"🔥",label:"Heat wave",desc:"consentement à l'imprévu sexuel et kinky engagé (ex: lieux engageants, invité·e·s) sans perte de contrôle"},
  {emoji:"❤️‍🔥",label:"Control kink",desc:"consentement à l'imprévu sexuel kinky sans perte de contrôle"},
  {emoji:"❤️",label:"Sweet body",desc:"consentement à l'imprévu sexuel vanille"},
  {emoji:"🩷",label:"Sweet heart",desc:"consentement à l'imprévu non-sexuel"},
  {emoji:"🤍",label:"Own Peace",desc:"besoin de respirer / me reposer / dormir, ne pas me déranger"},
  {emoji:"🏳",label:"White romance",desc:"épuisé·e mais besoin de toi"},
  {emoji:"🏴",label:"Dark romance",desc:"je ne vais pas bien et j'ai besoin de toi"},
  {emoji:"🕷",label:"Dark Vador",desc:"je ne vais pas bien mais j'aimerais qu'on me laisse"},
  {emoji:"🐝",label:"Busy bee",desc:"au travail / en groupe / truc important, ne pas déranger"},
  {emoji:"🪹",label:"Cuckoo's nest",desc:"en bonne compagnie, ne pas déranger"},
  {emoji:"🪺",label:"Bonobo's nest",desc:"en bonne compagnie, imprévus bienvenus si compagnie consentante et prévenue (ou complice) — inclus dans 💥 et 🔥"}
];

let myCurrentStatus=null;

function updateTheme(){document.body.classList.toggle('dark',new Date().getHours()>=20||new Date().getHours()<7);}

function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0');}

function renderButtons(){
  const list=document.getElementById('buttons-list');
  list.innerHTML='';
  choices.forEach(c=>{
    const full=c.emoji+' '+c.label;
    const row=document.createElement('div');
    row.className='btn-row';
    const btn=document.createElement('button');
    btn.className='status-btn';
    btn.dataset.value=full;
    btn.innerHTML='<span class="btn-emoji">'+c.emoji+'</span><div class="btn-text"><span class="btn-label">'+c.label+'</span><span class="btn-desc">'+c.desc+'</span></div>';
    btn.onclick=()=>setMyStatus(full);
    const vous=document.createElement('span');
    vous.className='btn-vous';
    vous.id='vous-'+c.label.replace(/[^a-zA-Z]/g,'');
    vous.textContent='← vous';
    row.appendChild(btn);
    row.appendChild(vous);
    list.appendChild(row);
  });
}

function highlightActive(s){
  document.querySelectorAll('.status-btn').forEach(b=>{
    const isActive=b.dataset.value===s;
    b.classList.toggle('active',isActive);
    const vous=b.closest('.btn-row')?.querySelector('.btn-vous');
    if(vous) vous.style.display=isActive?'block':'none';
  });
}

function setMyStatus(s){
  const isConfirm=s===myCurrentStatus;
  myCurrentStatus=s;
  highlightActive(s);
  db.ref('status/'+MY_USER).set({text:s,time:Date.now()});
  showToast(isConfirm?'Statut confirmé ✓':'Statut mis à jour ✓');
  setTimeout(refreshNudgePanel,500);
}

function getDesc(t){const f=choices.find(c=>t.startsWith(c.emoji));return f?f.desc:'';}

db.ref('status/'+OTHER_USER).on('value',snap=>{
  const d=snap.val();
  if(!d){document.getElementById('other-emoji').textContent='—';document.getElementById('other-name').textContent='pas encore de statut';return;}
  const p=d.text.split(' ');
  document.getElementById('other-emoji').textContent=p[0];
  document.getElementById('other-name').textContent=p.slice(1).join(' ');
  document.getElementById('other-desc').textContent=getDesc(d.text);
  const diff=Math.floor((Date.now()-d.time)/60000);
  const t=diff<1?"à l'instant":diff<60?'il y a '+diff+' min':diff<1440?'il y a '+Math.floor(diff/60)+'h':new Date(d.time).toLocaleDateString('fr-FR');
  document.getElementById('other-time').textContent='màj '+t;
});

db.ref('status/'+MY_USER).once('value',snap=>{
  const d=snap.val();
  if(d){myCurrentStatus=d.text;highlightActive(d.text);}
});

function refreshNudgePanel(){
  const pillsEl=document.getElementById('nudge-pills');
  const mainBtn=document.getElementById('nudge-main-btn');
  Promise.all([
    db.ref('meta/'+OTHER_USER+'/schedule').once('value'),
    db.ref('meta/'+OTHER_USER+'/nudge_sent_at').once('value'),
    db.ref('meta/'+OTHER_USER+'/n').once('value'),
    db.ref('status/'+OTHER_USER).once('value')
  ]).then(([schedSnap,nudgeSentSnap,nudgeActiveSnap,statusSnap])=>{
    const now=Date.now();
    const schedData=schedSnap.val();
    const nudgeSentAt=nudgeSentSnap.val()||0;
    const nudgeActiveRaw=nudgeActiveSnap.val();
    const nudgeActive=nudgeActiveRaw===true||nudgeActiveRaw==='true';
    const lastUpdate=statusSnap.val()?.time||0;
    const futureSlots=(schedData?.slots||[]).filter(t=>t>now);
    const pastSlots=(schedData?.slots||[]).filter(t=>t<=now);

    const nudgeSent=nudgeSentAt>0;
    const nudgeAnswered=nudgeSent&&lastUpdate>nudgeSentAt;
    const nudgePending=nudgeSent&&nudgeActive&&nudgeSentAt>lastUpdate;
    const nudgeNotified=nudgeSent&&!nudgeActive&&nudgeSentAt>lastUpdate;
    const nudgeUnanswered=nudgePending||nudgeNotified;

    const allPast=[...pastSlots];
    if(nudgeSent)allPast.push(nudgeSentAt);
    allPast.sort((a,b)=>b-a);
    const lastAnsweredTs=allPast.find(t=>t<lastUpdate);

    let pills=[];

    // Dernière réponse
    if(lastAnsweredTs&&lastUpdate>0){
      const ic=lastAnsweredTs===nudgeSentAt?'🚩':'⏰';
      pills.push({text:ic+' '+fmtTime(lastAnsweredTs)+' ✓ '+fmtTime(lastUpdate),cls:'done',w:'w2'});
    }

    // Nudge en attente
    if(nudgeUnanswered){
      const label=nudgePending?'envoyé':'notifié';
      pills.push({text:'🚩 '+fmtTime(nudgeSentAt)+' '+label,cls:'notified',w:'w2'});
    }

    // Rappels auto passés sans réponse
    pastSlots.filter(t=>t>lastUpdate).sort((a,b)=>b-a).forEach(t=>{
      pills.push({text:'⏰ '+fmtTime(t)+' en attente',cls:'waiting',w:'w1'});
    });

    // Prochains rappels
    futureSlots.forEach(t=>{
      pills.push({text:'→ ⏰ ~'+fmtTime(t),cls:'',w:'w1'});
    });

    // Aucune alerte prévue
    if(futureSlots.length===0){
      pills.push({text:'aucune alerte prévue avant demain',cls:'none',w:'wfull'});
    }

    pillsEl.innerHTML='';
    pills.forEach(p=>{
      const pill=document.createElement('div');
      pill.className='pill '+p.cls+' '+p.w;
      pill.textContent=p.text;
      pillsEl.appendChild(pill);
    });

    const hasWaiting=nudgeUnanswered||pastSlots.some(t=>t>lastUpdate);
    mainBtn.classList.toggle('waiting',hasWaiting);
    mainBtn.onclick=hasWaiting?null:sendNudge;
  });
}

function sendNudge(){
  const now=Date.now();
  db.ref('meta/'+OTHER_USER+'/n').set(true);
  db.ref('meta/'+OTHER_USER+'/nudge_sent_at').set(now);
  showToast('🚩 Demande envoyée');
  setTimeout(refreshNudgePanel,500);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

updateTheme();
renderButtons();
refreshNudgePanel();
setInterval(updateTheme,60000);
setInterval(refreshNudgePanel,30000);
</script>
</body>
</html>
